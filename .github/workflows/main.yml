name: Build IPC Kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖和工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev make zip wget
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz
          tar -xf clang+llvm-12.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -C /opt
          mv /opt/clang+llvm-12.0.1-x86_64-linux-gnu-* /opt/clang12
          wget -q -O arm64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm64 && tar -xf arm64.tar.gz -C /opt/gcc-arm64
          wget -q -O arm32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
          mkdir -p /opt/gcc-arm32 && tar -xf arm32.tar.gz -C /opt/gcc-arm32

      - name: 修复源码
        run: |
          chmod +x scripts/config scripts/clang-android.sh
          echo "" > scripts/drvgen/drvgen.mk 2>/dev/null
          sed -i 's|YYLTYPE yylloc|extern YYLTYPE yylloc|' scripts/dtc/dtc-lexer.l
          sed -i 's|YYLTYPE yylloc|extern YYLTYPE yylloc|' scripts/dtc/dtc-lexer.lex.c 2>/dev/null || true
          sed -i 's|$(objtree)/scripts/dtc/dtc|/usr/bin/dtc|g' scripts/Makefile.lib
          sed -i 's|scripts/dtc/dtc|/usr/bin/dtc|g' scripts/Makefile
          sed -i '/^hostprogs-y.*dtc/d' scripts/dtc/Makefile
          sed -i 's|hostprogs-y += dtc|#hostprogs-y += dtc|' scripts/dtc/Makefile
          echo "hostprogs-y :=" > scripts/dtc/Makefile
          sed -i 's/(unsigned int)\*cmdq_handle/(unsigned long)*cmdq_handle/g' drivers/gpu/drm/mediatek/mtk_drm_crtc.c 2>/dev/null || true
          grep -q "stpcpy" lib/string.c || printf '\n#ifndef __HAVE_ARCH_STPCPY\nchar *stpcpy(char *dest, const char *src)\n{\n\twhile ((*dest = *src) != '"'\\0'"') {\n\t\tdest++;\n\t\tsrc++;\n\t}\n\treturn dest;\n}\nEXPORT_SYMBOL(stpcpy);\n#endif\n' >> lib/string.c

      - name: 配置和编译
        run: |
          export PATH="/opt/clang12/bin:/opt/gcc-arm64/bin:/opt/gcc-arm32/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-androidkernel-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld atom_user_defconfig
          cd out
          ../scripts/config -e CONFIG_IPC
          ../scripts/config -e CONFIG_IPC_NS
          ../scripts/config -e CONFIG_NAMESPACES
          ../scripts/config -d CC_STACKPROTECTOR_STRONG
          ../scripts/config -d CC_STACKPROTECTOR
          ../scripts/config -d LTO_CLANG
          cd ..
          yes "" | make O=out ARCH=arm64 olddefconfig
          make -j$(nproc) O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld KCFLAGS="-Wno-error=pointer-to-int-cast" Image.gz

      - name: 上传 Image.gz
        uses: actions/upload-artifact@v4
        with:
          name: Image_IPC
          path: out/arch/arm64/boot/Image.gz
